<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Details</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>

  <body>
    <div
      class="d-flex justify-content-center align-items-center"
      style="min-height: 100vh"
    >
      <div class="w-75 rounded overflow-hidden shadow" style="height: 80vh">
        <div class="row h-100 m-0">
          <!-- LEFT -->
          <div
            class="col-lg-8 d-flex flex-column justify-content-between text-light p-4"
            style="
              background-image: url(&quot;https://i.pinimg.com/originals/0f/7f/c9/0f7fc9ea406af75bb1865578d978c589.png&quot;);
              background-size: cover;
              background-position: center;
            "
          >
            <h3>WEATHER FORECAST</h3>

            <div
              class="d-flex flex-column align-items-center justify-content-center flex-grow-1 text-center"
            >
              <h1 id="temp" class="display-2">°C</h1>
              <h4 id="place" class="mt-3"></h4>
              <p id="today"></p>

              <i id="weatherIcon" class="fa-solid fa-cloud fa-2x my-3"></i>
              <p id="icon"></p>
            </div>
          </div>

          <!-- RIGHT -->
          <div class="col-lg-4 bg-dark text-light p-4">
            <div class="d-flex mb-4">
              <input
                id="city"
                type="text"
                class="form-control"
                placeholder="Enter city name"
              />
              <button onclick="search()" class="btn btn-primary ms-2">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>

            <h5>Weather Details</h5>

            <div class="mt-4">
              <h6>Country</h6>
              <p id="country"></p>
            </div>

            <div>
              <h6>Humidity</h6>
              <p id="humidity"></p>
            </div>

            <div>
              <h6>Pressure</h6>
              <p id="pressure"></p>
            </div>

            <div>
              <h6>Wind</h6>
              <p id="wind"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const search = async () => {
        const cityName = city.value;

        if (cityName) {
          console.log(cityName);

          const result = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric`,
          );

          const serverResponse = await result.json();
          console.log(serverResponse);

          // update UI (teacher style)
          temp.innerHTML = `${serverResponse.main.temp}°C`;
          place.innerHTML = serverResponse.name;
          country.innerHTML = serverResponse.sys.country;
          humidity.innerHTML = serverResponse.main.humidity;
          pressure.innerHTML = serverResponse.main.pressure;
          wind.innerHTML = serverResponse.wind.speed;
          icon.innerHTML = serverResponse.weather[0].main;

          // date
          const now = new Date();
          today.innerHTML = now.toDateString();
        } else {
          alert("Input valid data");
        }
      };
    </script>
  </body>
</html>
